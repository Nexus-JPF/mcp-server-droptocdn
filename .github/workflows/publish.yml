# Publishes @droptocdn/mcp-server to npm with provenance (public repo required).
#
# npm Trusted Publisher (recommended):
#   npmjs.com → @droptocdn/mcp-server → Settings → Trusted Publishers
#   Owner: Nexus-JPF, Repo: mcp-server-droptocdn, Workflow: publish.yml
#
# Or GitHub secret NPM_TOKEN (granular token, Read and write, Bypass 2FA).
#
# Release: git tag v0.1.0 && git push origin v0.1.0

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish @droptocdn/mcp-server to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5..."
            if npm publish --provenance --access public; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Publish failed (often transient Sigstore/rekor outage). Retrying in 30s..."
              sleep 30
            fi
          done
          echo "Publish failed after 5 attempts."
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
