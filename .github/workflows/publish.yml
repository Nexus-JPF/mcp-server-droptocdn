# Publishes mcp-server-droptocdn to npm (OIDC trusted publishing) and the MCP Registry.
#
# npm: configure Trusted publishing on npmjs.com (no NPM_TOKEN needed for publish):
#   Package → Settings → Trusted publishing → GitHub Actions
#   Owner: Nexus-JPF, Repo: mcp-server-droptocdn, Workflow: publish.yml
#   Allowed actions: npm publish
#
# Requires npm CLI 11.5.1+ (installed in the "Prepare npm publish" step).
#
# MCP Registry: GitHub OIDC auth — no extra secrets required.
#
# Release: git tag v0.1.2 && git push origin v0.1.2

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish mcp-server-droptocdn
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare npm publish (OIDC)
        run: |
          npm install -g npm@latest
          npm --version
          # Remove auth lines that block OIDC token exchange
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi

      - name: Publish to npm
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5..."
            if npm publish --access public; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Publish failed (often transient Sigstore/rekor outage). Retrying in 30s..."
              sleep 30
            fi
          done
          echo "Publish failed after 5 attempts."
          exit 1

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '
            .version = $v |
            .packages[0].version = $v
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
