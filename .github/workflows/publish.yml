# Publishes mcp-server-droptocdn to npm (with provenance) and the MCP Registry.
#
# npm Trusted Publisher (optional):
#   npmjs.com → mcp-server-droptocdn → Settings → Trusted Publishers
#   Owner: Nexus-JPF, Repo: mcp-server-droptocdn, Workflow: publish.yml
#
# Or GitHub secret NPM_TOKEN (granular token, Read and write, Bypass 2FA).
#
# MCP Registry: GitHub OIDC auth — no extra secrets required.
#
# Release: git tag v0.1.2 && git push origin v0.1.2

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish mcp-server-droptocdn
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5..."
            if npm publish --provenance --access public; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Publish failed (often transient Sigstore/rekor outage). Retrying in 30s..."
              sleep 30
            fi
          done
          echo "Publish failed after 5 attempts."
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '
            .version = $v |
            .packages[0].version = $v
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
